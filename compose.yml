# NexBot (decoupled fork) — production Compose stack.
#
# No CopilotKit credentials are used anywhere in this stack: conversations live
# in the bundled `postgres` service and the app talks only to the model endpoint
# you configure. Nothing here contacts a CopilotKit host.
#
# Secrets have no defaults: `${VAR:?message}` makes `docker compose up` fail
# fast when a required value is missing, rather than starting with a weak one.
services:
  app:
    build:
      context: .
      target: app
    # Loopback-only publish. Front it with the reverse proxy in deployment/
    # (deployment/Caddyfile or deployment/nginx.conf.example). Never publish
    # 4310 on a public interface.
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      OWNER_TOKEN: ${OWNER_TOKEN:?Set a 24+ character OWNER_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4310}
      OWNER_ID: ${OWNER_ID:-nexbot-owner}
      # SQLite: non-conversation state (dots, spaces, pages, tasks, ...).
      DATABASE_PATH: /data/nexbot.sqlite
      # Postgres: conversations (REQUIRED). Replaces the CopilotKit service.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env, e.g. postgres://nexbot:<password>@postgres:5432/nexbot}
      # Optional setup telemetry. Unset (default) => nothing leaves the host.
      SETUP_TELEMETRY_ENDPOINT: ${SETUP_TELEMETRY_ENDPOINT:-}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_NAME: ${VOICE_NAME:-marin}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      # Slack: the managed vars are still accepted; SLACK_BOT_TOKEN and
      # SLACK_SIGNING_SECRET are OPTIONAL and NOT YET WIRED in this build.
      SLACK_CHANNEL_NAME: ${SLACK_CHANNEL_NAME:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
      SLACK_USER_IDS: ${SLACK_USER_IDS:-}
      SLACK_DOT_ID: ${SLACK_DOT_ID:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      # Telegram: the channel is inert until the token, webhook secret and the
      # owner allowlist are all set. TELEGRAM_DOT_ID picks the Dot that answers
      # a new chat; unset means the first Dot.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      TELEGRAM_DOT_ID: ${TELEGRAM_DOT_ID:-}
      AGENT_RUN_TIMEOUT_MS: ${AGENT_RUN_TIMEOUT_MS:-90000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_EXTRA_HEADERS: ${OPENAI_EXTRA_HEADERS:-}
      DOT_MODEL_API: ${DOT_MODEL_API:-auto}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-parallel}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      BROWSER_URL: http://browser:4311
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    volumes:
      - nexbot-data:/data
    networks:
      - conversations
      - browser-link
      - app-egress
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Recommended minimum for the core stack. Raise if you run many
          # concurrent agent turns.
          cpus: '1.0'
          memory: 1g

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - nexbot-pgdata:/var/lib/postgresql/data
    networks:
      - conversations
    # No `ports:` on purpose: Postgres is reachable only on the internal
    # `conversations` network, never from the host or the internet.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The official image entrypoint must chown the data directory and drop from
    # root to the `postgres` user. These are the minimum capabilities for that;
    # everything else stays dropped.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # Recommended minimum. Conversations grow with use; thread_events is
          # the fast-growing table.
          cpus: '1.0'
          memory: 1g

  browser:
    profiles: [browser]
    build:
      context: .
      target: browser
    environment:
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    networks:
      - browser-link
      - browser-egress
    init: true
    restart: unless-stopped
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  browser-link:
    internal: true
  # App -> Postgres only. `internal: true` means no route off the host.
  conversations:
    internal: true
  app-egress:
  browser-egress:
volumes:
  nexbot-data:
  nexbot-pgdata:
